[package]
name = "pixtool-desktop"
version = "1.2.7"
description = "Pixtool Next masaüstü kabuğu"
authors = ["Pixtool"]
edition = "2021"
rust-version = "1.77"
license = "UNLICENSED"

[lib]
name = "pixtool_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
# Otomatik guncelleme (imzali paket indirir ve kurar)
tauri-plugin-updater = "2"
# Guncelleme sonrasi yeniden baslatma
tauri-plugin-process = "2"
# Arayüz kaynağını yoklamak için (uzak/yerel kararı)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# Derleme boyutunu küçült (dağıtım için)
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
